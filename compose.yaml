services:
  explorer:
    build: .
    image: edgenext-explorer:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - path: .env.aws
        format: raw
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
