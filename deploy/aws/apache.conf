<VirtualHost *:80>
    DocumentRoot /var/www/app/selfhost/public
    <Directory /var/www/app/selfhost/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
ServerSignature Off
