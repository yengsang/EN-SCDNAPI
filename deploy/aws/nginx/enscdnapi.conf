server {
    listen 80;
    listen [::]:80;
    server_name enscdnapi.yengsang.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://enscdnapi.yengsang.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name enscdnapi.yengsang.com;

    ssl_certificate /etc/letsencrypt/live/enscdnapi.yengsang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enscdnapi.yengsang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "EdgeNext API Explorer";
    auth_basic_user_file /etc/nginx/enscdnapi.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_hide_header Authorization;
        # Browser login credentials are checked by Nginx, not the application.
        proxy_set_header Authorization "";
    }
}
